<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>RTS Médiéval</title>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;user-select:none}
#hud{position:fixed;top:0;left:0;right:0;background:rgba(40,25,10,.85);color:#f3e2b3;padding:8px 14px;display:flex;gap:24px;font-size:16px}
#panel{position:fixed;bottom:0;left:0;background:rgba(40,25,10,.85);color:#f3e2b3;padding:10px;min-width:260px;min-height:60px}

#msg{position:fixed;top:44px;width:100%;text-align:center;color:#fff;text-shadow:0 0 4px #000}

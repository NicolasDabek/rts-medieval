<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>RTS Médiéval</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;background:#000}
canvas{display:block;touch-action:none}
.ui{background:rgba(40,25,10,.88);color:#f3e2b3}
#hud{position:fixed;top:0;left:0;right:0;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px;z-index:5}
#panel{position:fixed;bottom:0;left:0;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));min-width:280px;max-width:520px;min-height:56px;z-index:5;font-size:14px}
button{font:inherit;background:#6b4a22;color:#fff;border:1px solid #c9a35a;border-radius:6px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4}
#panel button{margin:3px;padding:6px 10px;min-height:40px}
#tools{position:fixed;left:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5}
#tools button{width:52px;height:52px;font-size:20px;background:rgba(60,40,15,.85)}
#tools button.on{background:#c9a35a;color:#000}
#box{position:fixed;border:1px solid #fff;background:rgba(255,255,255,.15);display:none;pointer-events:none;z-index:4}
#msg{position:fixed;top:48px;width:100%;text-align:center;color:#fff;text-shadow:0 0 4px #000;pointer-events:none;font-size:17px;z-index:5}
#help{position:fixed;bottom:0;right:0;background:rgba(0,0,0,.55);color:#ddd;font-size:12px;padding:6px 8px;z-index:5}
#mini{position:fixed;right:8px;bottom:58px;width:170px;height:170px;border:2px solid #c9a35a;z-index:5;touch-action:none;image-rendering:pixelated}
#end{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:10}
#end h1{font-size:48px;margin:0 0 20px}
#end button{font-size:22px;padding:12px 30px}
@media (pointer:coarse),(max-width:760px){
 #hud{font-size:13px;gap:2px 12px}
 #help{display:none}
 #panel{right:0;max-width:none;min-width:0}
 #panel button{min-height:46px;padding:8px 12px}
 #mini{top:auto;bottom:auto;top:calc(52px + env(safe-area-inset-top));right:6px;width:116px;height:116px}
}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body>
<div id="hud" class="ui"><span>🪵 <b id="bois">0</b></span><span>🪨 <b id="pierre">0</b></span><span>💰 <b id="or">0</b></span><span>👥 <b id="pop">0</b></span><span>⏱ <b id="time">0:00</b></span></div>
<div id="tools">
 <button data-act="box" title="Mode sélection par cadre">▭</button>
 <button data-act="atk" title="Attaque-déplacement (F)">⚔</button>
 <button data-act="army" title="Sélectionner toute l'armée">🛡</button>
 <button data-act="home" title="Centrer sur l'hôtel de ville (H)">🏰</button>
 <button data-act="desel" title="Tout désélectionner (Échap)">✖</button>
</div>
<div id="panel" class="ui"></div><div id="box"></div><div id="msg"></div>
<canvas id="mini" width="160" height="160"></canvas>
<div id="help">Clic gauche / glisser : sélection (Maj = ajouter) · Clic droit : déplacer / récolter / attaquer / construire<br>F + clic : attaque-déplacement · WASD/ZQSD/flèches/bords : caméra · Molette : zoom · H : base · Échap : annuler</div>
<div id="end"><h1 id="endTitle"></h1><p id="endSub"></p><button onclick="location.reload()">Rejouer</button></div>
<script type="module" src="./main.js"></script>
</body></html>
